<svg xmlns="http://www.w3.org/2000/svg" width="489" height="168" viewBox="0 0 489 168">
<style>
.t{font:16px 'LZ',monospace;white-space:pre}
.fg{fill:#d9e6ff}.dim{fill:#5d6d8a}.hot{fill:#ffffff}.acc{fill:#8fd4ff}.ink{fill:#05080f}.inkd{fill:#34425c}
.a{opacity:0;animation:on 1ms linear forwards}
.boot{animation:off 1ms linear forwards}
.cur{animation:blink 1.06s steps(1) infinite}
.pow{transform-box:view-box;transform-origin:50% 50%;animation:pow .5s ease-out both}
.ray{animation:ray 7s linear infinite}
.fl{animation:fl 5s steps(1) infinite}
.z{transform-box:fill-box;transform-origin:50% 50%;animation:slap .2s cubic-bezier(.2,.7,.3,1) both}
.tp{transform-box:fill-box;transform-origin:0 50%;animation:unroll .16s ease-out both}
@keyframes on{to{opacity:1}}
@keyframes off{to{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes pow{0%{transform:scale(1,.004);opacity:.2}55%{transform:scale(1,.004);opacity:1}100%{transform:scale(1,1)}}
@keyframes ray{from{transform:translateY(-160px)}to{transform:translateY(168px)}}
@keyframes fl{0%,100%{opacity:1}47%{opacity:.93}49%{opacity:1}83%{opacity:.96}}
@keyframes slap{0%{opacity:0;transform:translateY(-16px) scale(1.9) rotate(var(--s))}30%{opacity:1}72%{transform:scale(.95)}100%{opacity:1;transform:none}}
@keyframes unroll{from{transform:scaleX(0)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}.boot{display:none}.cur,.pow,.ray,.fl,.z,.tp{animation:none}.ray{display:none}}
@font-face{font-family:'LZ';src:url(data:font/woff2;base64,) format('woff2')}</style>
<defs>
<clipPath id="scr"><rect width="489" height="168" rx="10"/></clipPath>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect y="2" width="4" height="1" fill="#000" opacity=".38"/></pattern>
<pattern id="desk" width="9.6" height="10.0" patternUnits="userSpaceOnUse"><rect width="1.6" height="1.6" fill="#5d6d8a" opacity=".45"/></pattern>
<radialGradient id="vig" cx="50%" cy="50%" r="72%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".72"/></radialGradient>
<radialGradient id="tube" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#101a2c"/><stop offset="100%" stop-color="#05080f"/></radialGradient>
<linearGradient id="rayg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9e6ff" stop-opacity="0"/><stop offset=".5" stop-color="#d9e6ff" stop-opacity=".05"/><stop offset="1" stop-color="#d9e6ff" stop-opacity="0"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".06"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g clip-path="url(#scr)">
<rect width="489" height="168" fill="url(#tube)"/>
<g class="fl"><g filter="url(#glow)">
<rect x="23.6" y="24.0" width="460.8" height="140.0" fill="#000" opacity=".6"/>
<rect x="14.0" y="14.0" width="460.8" height="140.0" fill="#05080f" />
<rect x="21.3" y="26.5" width="446.2" height="115.0" fill="none" stroke="#d9e6ff" stroke-width="1.4"/>
<rect x="16.3" y="21.5" width="456.2" height="125.0" fill="none" stroke="#d9e6ff" stroke-width="1.4"/>
<rect x="33.2" y="14.0" width="144.0" height="20.0" fill="#05080f" />
<text class="t" xml:space="preserve" x="33.2" y="29.0"><tspan class="acc">[■]</tspan><tspan class="hot"> SIMPLE-ORM </tspan></text>
<text class="t" xml:space="preserve" x="33.2" y="49.0"><tspan class="fg">Маленькая </tspan><tspan class="hot">ORM </tspan><tspan class="fg">поверх sqlite3 без лишней</tspan></text>
<text class="t" xml:space="preserve" x="33.2" y="69.0"><tspan class="fg">магии</tspan></text>
<text class="t" xml:space="preserve" x="33.2" y="129.0"><tspan class="acc">*</tspan><tspan class="fg"> 4   </tspan><tspan class="dim">язык</tspan><tspan class="fg"> Python</tspan></text><text class="t" xml:space="preserve" x="350.0" y="129.0"><tspan class="hot">[ ОТКРЫТЬ ]</tspan></text>
</g></g>

<rect class="ray" width="489" height="160" fill="url(#rayg)"/>
<rect width="489" height="168" fill="url(#scan)"/>
<rect width="489" height="168" fill="url(#vig)"/>
<rect width="489" height="168" fill="url(#glass)"/>
</g>
</svg>