<svg xmlns="http://www.w3.org/2000/svg" width="512" height="192" viewBox="0 0 512 192">
<style>
.t{font:16px 'LZ',monospace;white-space:pre}
.fg{fill:#ffb547}.dim{fill:#94591a}.hot{fill:#fff2d4}.acc{fill:#ff7b30}.ink{fill:#140b02}.inkd{fill:#6b3d0c}
.silk{font:700 13px 'LZS',sans-serif;letter-spacing:.34em;fill:#d2c8b6}
.silk2{font:500 10px 'LZS',sans-serif;letter-spacing:.26em;fill:#857e72}
.a{opacity:0;animation:on 1ms linear forwards}
.boot{animation:off 1ms linear forwards}
.cur{animation:blink 1.06s steps(1) infinite}
.pow{transform-box:view-box;transform-origin:50% 50%;animation:pow .5s ease-out both}
.ray{animation:ray 7s linear infinite}
.fl{animation:fl 5s steps(1) infinite}
@keyframes on{to{opacity:1}}
@keyframes off{to{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes pow{0%{transform:scale(1,.004);opacity:.2}55%{transform:scale(1,.004);opacity:1}100%{transform:scale(1,1)}}
@keyframes ray{from{transform:translateY(-160px)}to{transform:translateY(168px)}}
@keyframes fl{0%,100%{opacity:1}47%{opacity:.93}49%{opacity:1}83%{opacity:.96}}
@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}.boot{display:none}.cur,.pow,.ray,.fl{animation:none}.ray{display:none}}
@font-face{font-family:'LZ';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}</style>
<defs>
<clipPath id="scr"><rect x="12" y="12" width="488.79999999999995" height="168" rx="8"/></clipPath>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect y="2" width="4" height="1" fill="#000" opacity=".38"/></pattern>
<pattern id="desk" width="9.6" height="10.0" patternUnits="userSpaceOnUse"><rect width="1.6" height="1.6" fill="#94591a" opacity=".45"/></pattern>
<radialGradient id="vig" cx="50%" cy="50%" r="72%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".72"/></radialGradient>
<radialGradient id="tube" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#2a1806"/><stop offset="100%" stop-color="#140b02"/></radialGradient>
<linearGradient id="rayg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb547" stop-opacity="0"/><stop offset=".5" stop-color="#ffb547" stop-opacity=".06"/><stop offset="1" stop-color="#ffb547" stop-opacity="0"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="plastic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2824"/><stop offset="1" stop-color="#1b1917"/></linearGradient>
<filter id="glow" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="512" height="192" rx="14" fill="url(#plastic)"/><rect x="1.5" y="1.5" width="509" height="189" rx="13" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="1.5"/>
<g clip-path="url(#scr)">
<rect x="12" y="12" width="488.79999999999995" height="168" fill="url(#tube)"/>
<g class="fl"><g filter="url(#glow)">
<rect x="35.6" y="36.0" width="460.8" height="140.0" fill="#000" opacity=".6"/>
<rect x="26.0" y="26.0" width="460.8" height="140.0" fill="#140b02" />
<rect x="33.3" y="38.5" width="446.2" height="115.0" fill="none" stroke="#ffb547" stroke-width="1.4"/>
<rect x="28.3" y="33.5" width="456.2" height="125.0" fill="none" stroke="#ffb547" stroke-width="1.4"/>
<rect x="45.2" y="26.0" width="220.8" height="20.0" fill="#140b02" />
<text class="t" xml:space="preserve" x="45.2" y="41.0"><tspan class="acc">[■]</tspan><tspan class="hot"> FLIPPERZERO-4INROW </tspan></text>
<text class="t" xml:space="preserve" x="45.2" y="61.0"><tspan class="fg">«Четыре в ряд» для </tspan><tspan class="hot">Flipper Zero</tspan><tspan class="fg">: классика на</tspan></text>
<text class="t" xml:space="preserve" x="45.2" y="81.0"><tspan class="fg">дельфине</tspan></text>
<text class="t" xml:space="preserve" x="45.2" y="141.0"><tspan class="acc">*</tspan><tspan class="fg"> 6   </tspan><tspan class="dim">язык</tspan><tspan class="fg"> C</tspan></text><text class="t" xml:space="preserve" x="362.0" y="141.0"><tspan class="hot">[ ОТКРЫТЬ ]</tspan></text>
</g></g>
<rect class="ray" x="12" y="12" width="488.79999999999995" height="160" fill="url(#rayg)"/>
<rect x="12" y="12" width="488.79999999999995" height="168" fill="url(#scan)"/>
<rect x="12" y="12" width="488.79999999999995" height="168" fill="url(#vig)"/>
<rect x="12" y="12" width="488.79999999999995" height="168" fill="url(#glass)"/>
</g>
<rect x="12" y="12" width="488.79999999999995" height="168" rx="8" fill="none" stroke="#000" stroke-width="3"/>

</svg>