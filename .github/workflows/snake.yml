name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#6f4e37&color_dots=#ebedf0,#e8d5bf,#c8a27a,#8b6343,#3b2a20
            dist/snake-dark.svg?palette=github-dark&color_snake=#c8a27a&color_dots=#161b22,#3b2a20,#6f4e37,#a07a55,#c8a27a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
